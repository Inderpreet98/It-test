<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Easy Student OS Installation Hub</title>
    <style>
        :root {
            --bg-body: #f8fafc;
            --bg-card: #ffffff;
            --text-title: #0f172a;
            --text-body: #334155;
            --primary: #3b82f6;
            --success: #10b981;
            --danger: #ef4444;
        }
        body { font-family: system-ui, sans-serif; margin: 0; padding: 2rem; background: var(--bg-body); color: var(--text-body); }
        .card { background: var(--bg-card); border-radius: 12px; padding: 2rem; margin-bottom: 2rem; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .btn-action { background: var(--primary); color: white; border: none; padding: 0.75rem 1.5rem; border-radius: 6px; cursor: pointer; width: 100%; font-weight: bold; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Operating System Class Dashboard</h1>
        <p>Interactive installation guides for Windows, Linux, and macOS have been streamlined to prevent browser freezes.</p>
        <button id="submitQuizBtn" type="button" class="btn-action">✅ Test Interaction</button>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const btn = document.getElementById('submitQuizBtn');
            if(btn) {
                btn.addEventListener('click', () => {
                    alert('Clicks are working properly now!');
                });
            }
        });
    </script>
</body>
</html>
